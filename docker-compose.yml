# Historical local development configuration; not a production deployment.
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: biogamed_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: biogamed
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: biogamed_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - AUTH_LOGIN_LIMIT=${AUTH_LOGIN_LIMIT:-120}
      - AUTH_LOGIN_WINDOW_SECONDS=${AUTH_LOGIN_WINDOW_SECONDS:-600}
      - AUTH_ACTIVATION_LIMIT=${AUTH_ACTIVATION_LIMIT:-15}
      - AUTH_ACTIVATION_WINDOW_SECONDS=${AUTH_ACTIVATION_WINDOW_SECONDS:-600}
      - AUTH_IMPORT_LIMIT=${AUTH_IMPORT_LIMIT:-60}
      - AUTH_IMPORT_WINDOW_SECONDS=${AUTH_IMPORT_WINDOW_SECONDS:-600}
      - BIOGAMED_PUBLIC_URL=${BIOGAMED_PUBLIC_URL:-http://localhost:3000}
      - BIOGAMED_ACTIVATION_TTL_HOURS=${BIOGAMED_ACTIVATION_TTL_HOURS:-24}
      - BIOGAMED_INVITATION_COOLDOWN_SECONDS=${BIOGAMED_INVITATION_COOLDOWN_SECONDS:-60}
      - BIOGAMED_SMTP_HOST=${BIOGAMED_SMTP_HOST:-}
      - BIOGAMED_SMTP_PORT=${BIOGAMED_SMTP_PORT:-587}
      - BIOGAMED_SMTP_SECURITY=${BIOGAMED_SMTP_SECURITY:-starttls}
      - BIOGAMED_SMTP_FROM=${BIOGAMED_SMTP_FROM:-}
      - BIOGAMED_SMTP_USERNAME=${BIOGAMED_SMTP_USERNAME:-}
      - BIOGAMED_SMTP_PASSWORD=${BIOGAMED_SMTP_PASSWORD:-}
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/biogamed
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: biogamed_frontend
    command: sh -c "npm ci && npm run dev -- --webpack"
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
