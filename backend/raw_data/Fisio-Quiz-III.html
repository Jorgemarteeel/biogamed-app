<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fisio-Quiz-III</title>
<style>
:root{
  --bg:#0b1220;
  --panel:#0f1a33;
  --text:#e9eefc;
  --muted:#a8b3d6;
  --blue:#add8e6;
  --green:#9dffb0;
  --red:#ff8b8b;
  --highlight:#ffd36a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background: radial-gradient(1200px 600px at 50% 0%, #182b57 0%, var(--bg) 55%, #070b14 100%);
  color:var(--text);
  min-height:100vh;
}
header{
  padding:16px 18px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
header h1{
  margin:0;
  font-size:30px;
  letter-spacing:.3px;
  font-weight:650;
}
.controls{
  position:absolute;
  right:18px;
  display:flex;
  gap:10px;
  align-items:center;
}
button{
  border:0;
  background:#ffd36a;
  color:black;
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:650;
  box-shadow:0 10px 25px rgba(43,88,255,.25);
}
button:disabled{
  background: rgba(255,255,255,.09);
  box-shadow:none;
  color:var(--text);
  opacity:.5;
  cursor:not-allowed;
}
.wrap{
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
}
.board{
  background: rgba(15,26,51,.65);
  border:5px solid rgba(255,255,255,.10);
  border-radius:18px;
  padding:14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.35);
  position:relative;
  overflow:hidden;
}
.board.active{
  outline: 5px solid var(--highlight);
  box-shadow: 
    0 0 0 4px rgba(255,211,106,.35),
    0 18px 55px rgba(0,0,0,.45);
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.playerName{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width: 52%;
}
.playerName label{
  font-size:12px;
  color:var(--muted);
}
.nameInput{
  width:100%;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color:var(--text);
  outline:none;
  font-size:15px;
  font-weight:750;
}
.meta{
  text-align:right;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width: 40%;
}
.meta .time{
  font-size:24px;
  font-weight:850;
  letter-spacing:.4px;
}
.meta .score{
  font-size:12px;
  color:var(--muted);
}
.map{
  position:relative;
  width:500px;
  height:431px;
  margin:6px auto 12px;

  background-image: url("cerebro.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.node{
  position:absolute;
  width:50px;
  height:50px;
  border-radius:50%;
  background: var(--blue);
  border:2px solid #000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#000;
  user-select:none;
  transition: transform .1s;
}
.node.correct{ background: var(--green); border-color: var(--green); }
.node.wrong{ background: var(--red); border-color: var(--red); }
.node.passed{ opacity:.8; }
.node.active{
  outline:4px solid var(--highlight);
  transform: scale(1.1);
}
.qa{
  margin-top:10px;
  background: rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:12px;
}
.qa .question{
  font-size:16px;
  margin-bottom:8px;
}
.qa .row{
  display:flex;
  gap:10px;
  align-items:center;
}
input[type="text"].answer{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color:var(--text);
  outline:none;
  font-size:14px;
}
input[type="text"].answer::placeholder{color:rgba(233,238,252,.55);}
.footerMsg {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0 16px;
  color: var(--highlight);
  font-size: 24px;
  font-weight:700;
  min-height: 60px;
  text-align:center;
}
.time.activeTimer { color: var(--highlight); font-weight:850; }

.app-footer{
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  padding: 8px 0;
  font-size: 12px;
  color: rgba(233,238,252,0.6);
  background: rgba(11,18,32,0.85);
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}


</style>
</head>

<footer class="app-footer">
  © Juan Vladimir de la Rosa Medina
</footer>

(() => {

const QUESTIONS = [

  { q:"Empieza por la letra A: Respuesta motora automática e involuntaria.", a:"acto-reflejo" },
  { q:"Empieza por la letra R: Reflejo miotático.", a:"rotuliano" },

  { q:"Empieza por la letra E: Potencial local que decrece con la distancia.", a:"electrotónico" },
  { q:"Empieza por la letra R: Frecuencia de descarga neuronal.", a:"rate" },
  { q:"Empieza por la letra P: Plasticidad que fortalece sinapsis activas.", a:"potenciación" },

  { q:"Empieza por la letra L: Plasticidad sináptica depresiva.", a:"LTD" },
  { q:"Empieza por la letra N: Receptor ionotrópico de glutamato permeable a Ca2+.", a:"NMDA" },
  { q:"Empieza por la letra A: Receptor ionotrópico de glutamato rápido.", a:"AMPA" },
  { q:"Empieza por la letra M: Receptor metabotrópico acoplado a proteína G.", a:"muscarínico" },
  { q:"Empieza por la letra N: Receptor ionotrópico colinérgico.", a:"nicotínico" },
  { q:"Empieza por la letra O: Célula glial que mieliniza en el SNC.", a:"oligodendrocito" },
  { q:"Empieza por la letra S: Célula glial que mieliniza en el SNP.", a:"schwann" },
  { q:"Empieza por la letra A: Célula glial implicada en soporte metabólico.", a:"astrocito" },
  { q:"Empieza por la letra M: Célula inmunitaria residente del SNC.", a:"microglía" },
  { q:"Empieza por la letra C: Sustancia gris del SNC formada principalmente por somas neuronales.", a:"corteza" },
  { q:"Empieza por la letra B: Sustancia del SNC formada mayoritariamente por axones mielinizados.", a:"blanca" },
  { q:"Empieza por la letra P: Región del tronco encefálico implicada en control respiratorio.", a:"protuberancia" },
  { q:"Empieza por la letra B: Parte del tronco encefálico que conecta con la médula espinal.", a:"bulbo" },
  { q:"Empieza por la letra R: Formación implicada en el estado de alerta.", a:"reticular" },
  { q:"Empieza por la letra S: Núcleo hipotalámico implicado en ritmos circadianos.", a:"supraquiasmático" },
  { q:"Empieza por la letra H: Región cerebral que regula la homeostasis.", a:"hipotálamo" },
  { q:"Empieza por la letra V: Nervio craneal implicado en la audición y el equilibrio.", a:"vestibulococlear" },
  { q:"Empieza por la letra O: Nervio craneal responsable del olfato.", a:"olfatorio" },
  { q:"Empieza por la letra T: Nervio craneal con función sensitiva y motora facial.", a:"trigémino" },
  { q:"Empieza por la letra F: Nervio craneal que controla la musculatura facial.", a:"facial" },
  { q:"Empieza por la letra V: Nervio craneal con funciones parasimpáticas viscerales.", a:"vago" },
  { q:"Empieza por la letra E: Potencial sináptico generado por la apertura de canales de sodio.", a:"excitatorio" },

  { q:"Empieza por la letra E: Tipo de sumación que depende del espacio.", a:"espacial" },

  { q:"Empieza por la letra S: Área cortical primaria responsable de la sensibilidad corporal.", a:"somatosensorial" },

  { q:"Empieza por la letra E: Conjunto de vías motoras indirectas.", a:"extrapiramidal" },
  { q:"Empieza por la letra B: Núcleos implicados en el control del movimiento.", a:"basales" },

  { q:"Empieza por la letra G: Receptor metabotrópico inhibidor.", a:"GABAb" },
  { q:"Empieza por la letra U: Concentración mínima de estímulo para activar un receptor.", a:"umbral" },
  { q:"Empieza por la letra F: Adaptación rápida de receptores sensoriales.", a:"fásica" },
  { q:"Empieza por la letra T: Adaptación lenta de receptores sensoriales.", a:"tónica" },
  { q:"Empieza por la letra M: Receptor sensorial de adaptación lenta.", a:"Merkel" },
  { q:"Empieza por la letra P: Receptor sensorial de adaptación rápida.", a:"Pacini" },
  { q:"Empieza por la letra N: Receptor sensorial del dolor.", a:"nociceptor" },
  { q:"Empieza por la letra T: Receptor sensorial de temperatura.", a:"termorreceptor" },
  { q:"Empieza por la letra N: Percepción consciente del dolor.", a:"nocicepción" },
  { q:"Empieza por la letra I: Sustancia liberada en sinapsis eléctricas.", a:"iones" },
  { q:"Empieza por la letra E: Tipo de sinapsis basada en uniones gap.", a:"eléctrica" },
  { q:"Empieza por la letra S: Región funcional de la neurona donde se inicia el PA.", a:"segmento inicial" }
];

  const norm = s => (s ?? "")
    .toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  const players = [
    { name:"Jugador 1", idx:0, qa:[], states:Array(34).fill("pending"), time:START_TIME, correct:0, wrong:0, done:false },
    { name:"Jugador 2", idx:0, qa:[], states:Array(34).fill("pending"), time:START_TIME, correct:0, wrong:0, done:false }
  ];

  let active = 0;
  let started = false;
  let ticker = null;

  const els = {
    map:[map0,map1],
    q:[q0,q1],
    a:[a0,a1],
    send:[send0,send1],
    time:[time0,time1],
    score:[score0,score1],
    board:[board0,board1],
    name:[name0,name1],
    status: statusMsg,
    btnReset: btnReset
  };

  const nodes = [[],[]];

  els.status.textContent = "✏️ Introduce los nombres de los jugadores y pulsa 👉 en el botón 'Iniciar juego'";

  /* ===== TABLERO (SIN CAMBIOS) ===== */

  function buildMaps(){
    for(let pi=0; pi<2; pi++){
      els.map[pi].innerHTML="";
      nodes[pi]=[];
      POSITIONS.forEach((pos,i)=>{
        const d=document.createElement("div");
        d.className="node pending";
        d.textContent=i+1;
        d.style.left=(pos.x-25)+"px";
        d.style.top =(pos.y-25)+"px";
        els.map[pi].appendChild(d);
        nodes[pi].push(d);
      });
    }
  }

  const formatTime = ms => {
    const t=Math.max(0,Math.floor(ms/1000));
    return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  };

  const isGameOver = () => players.every(p=>p.done);

  function nextPending(pi, fromIdx, includeCurrent=false){
    const p=players[pi];
    const start=includeCurrent ? fromIdx : (fromIdx+1)%p.qa.length;
    for(let s=0;s<p.qa.length;s++){
      const i=(start+s)%p.qa.length;
      if(p.states[i]==="pending"||p.states[i]==="passed") return i;
    }
    return null;
  }

  /* ===== ASIGNACIÓN ALEATORIA DE PREGUNTAS ===== */
  function assignQuestions(){
    // Mezclamos todas las preguntas
    const shuffled = QUESTIONS.sort(() => Math.random() - 0.5);
    const half = Math.floor(shuffled.length / 2);

    // Cada jugador recibe la mitad del mazo sin repetir preguntas
    players[0].qa = shuffled.slice(0, half);
    players[1].qa = shuffled.slice(half, half*2);

    // Si el número de preguntas es mayor que 34, se recortan a 34
    players.forEach(p => { p.qa = p.qa.slice(0,34); });
  }

  /* ===== ACTUALIZACIÓN DE INTERFAZ ===== */
  function updateUI(){
    players.forEach((p,pi)=>{
      els.board[pi].classList.toggle("active", pi===active && started && !p.done);
      els.time[pi].textContent=formatTime(p.time);
      els.score[pi].textContent=`Aciertos: ${p.correct} · Fallos: ${p.wrong}`;

      nodes[pi].forEach((n,i)=>{
        n.className="node "+p.states[i]+((pi===active&&i===p.idx&&started&&!p.done)?" active":"");
      });

      const canPlay=started&&pi===active&&!p.done&&!isGameOver();
      els.a[pi].disabled=!canPlay;
      els.send[pi].disabled=!canPlay;
    });
  }

  function refreshQuestion(pi){
    const p=players[pi];
    els.q[pi].style.color="var(--highlight)";

    if(!started){
      els.q[pi].textContent="Pulsa Iniciar para comenzar";
      return;
    }

    if(p.done){
      els.q[pi].textContent="Inmuno-Quiz completado";
      return;
    }

    if(pi!==active){
      els.q[pi].textContent="Espera tu turno…";
      return;
    }

    p.idx=nextPending(pi,p.idx,true);
    els.q[pi].textContent=p.qa[p.idx].q;
    els.a[pi].focus();
  }

  function startTicker(){
    if(ticker) clearInterval(ticker);
    ticker=setInterval(()=>{
      if(!started||isGameOver()) return;
      const p=players[active];
      if(!p.done){
        p.time-=100;
        if(p.time<=0){
          p.time=0;
          p.done=true;
          els.status.textContent=`⏰ ${p.name} ha agotado su tiempo`;
          switchTurn();
        }
        updateUI();
        endIfNeeded();
      }
    },100);
  }

  function switchTurn(){
    const prev=active;
    active=active===0?1:0;
    if(players[active].done&&!players[prev].done) active=prev;
    updateUI();
    refreshQuestion(active);
  }

  function checkAnswer(pi, raw){
    if(!started||pi!==active||players[pi].done) return;

    const p=players[pi];
    const idx=p.idx;
    const got=norm(raw);
    const expected=norm(p.qa[idx].a);

    if(!got){
      els.status.textContent="Escribe una respuesta o 'fisiopalabra'";
      return;
    }

    if(got==="fisiopalabra"){
      if(p.states[idx]==="pending") p.states[idx]="passed";
      p.idx=nextPending(pi,idx);

      const other = pi === 0 ? 1 : 0;
      const siguienteJugador = players[other].name;

      els.status.textContent =`💉 ${p.name} se protege de la pregunta de la casilla ${idx + 1} y pierde el turno. Turno para ${siguienteJugador}.`;
      els.a[pi].value="";
      switchTurn();
      return;
    }

    if(got===expected){
      p.states[idx]="correct";
      p.correct++;
      els.a[pi].value="";
      els.status.textContent =`✅ ${p.name} acierta la pregunta de la casilla ${idx + 1}. Sigue jugando.`;
      p.idx=nextPending(pi,idx);
      refreshQuestion(pi);
      updateUI();
      endIfNeeded();
      return;
    }

    else{
      p.states[idx] = "wrong";
      p.wrong++;

      const other = pi === 0 ? 1 : 0;
      const siguienteJugador = players[other].name;

      els.status.textContent =
        `❌ ${p.name} falla la pregunta de la casilla ${idx + 1}. La respuesta correcta era: "${p.qa[idx].a}". Turno para ${siguienteJugador}.`;

      els.a[pi].value = "";
      switchTurn();
    }
  }

  function endIfNeeded(){
    players.forEach((p,pi)=>{
      if(!p.done && p.states.every(s => s === "correct" || s === "wrong")){
        p.done = true;
        els.q[pi].textContent = "Inmuno-Quiz completado";
        els.q[pi].style.color = "var(--highlight)";
        els.a[pi].disabled = true;
        els.send[pi].disabled = true;
      }
    });

    if(isGameOver()){
      clearInterval(ticker);

      let msg = `Inmuno-Quiz finalizado. ${players[0].name}: ${players[0].correct} · ${players[1].name}: ${players[1].correct}. `;
      if(players[0].correct > players[1].correct) msg += `🏆 Gana ${players[0].name}`;
      else if(players[1].correct > players[0].correct) msg += `Gana ${players[1].name}`;
      else msg += `Empate`;

      els.status.textContent = msg;
    }
  }

  btnStart.onclick=()=>{
    started=true;
    players.forEach((p,pi)=>{
      p.name=els.name[pi].value.trim()||`Jugador ${pi+1}`;
      p.idx=0;
      p.states.fill("pending");
      p.correct=0;
      p.wrong=0;
      p.time=START_TIME;
      p.done=false;
      els.name[pi].disabled=true;
    });

    assignQuestions();
    buildMaps();
    active=Math.random()<0.5?0:1;
    els.status.textContent=`🎲 Sorteo: comienza ${players[active].name}`;
    btnReset.disabled=false;
    updateUI();
    refreshQuestion(active);
    startTicker();
    btnStart.disabled=true;
  };

  btnReset.onclick=()=>location.reload();

  els.send[0].onclick=()=>checkAnswer(0,els.a[0].value);
  els.send[1].onclick=()=>checkAnswer(1,els.a[1].value);
  els.a[0].addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer(0,els.a[0].value);});
  els.a[1].addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer(1,els.a[1].value);});

  buildMaps();

})();
</script>
