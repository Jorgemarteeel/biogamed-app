services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: biogamed
      POSTGRES_DB: biogamed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U biogamed -d biogamed"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    environment:
      DATABASE_URL: postgresql://biogamed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/biogamed
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-120}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-600}
      AUTH_ACTIVATION_LIMIT: ${AUTH_ACTIVATION_LIMIT:-15}
      AUTH_ACTIVATION_WINDOW_SECONDS: ${AUTH_ACTIVATION_WINDOW_SECONDS:-600}
      AUTH_IMPORT_LIMIT: ${AUTH_IMPORT_LIMIT:-60}
      AUTH_IMPORT_WINDOW_SECONDS: ${AUTH_IMPORT_WINDOW_SECONDS:-600}
      BIOGAMED_PUBLIC_URL: ${BIOGAMED_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-14004}}
      BIOGAMED_ACTIVATION_TTL_HOURS: ${BIOGAMED_ACTIVATION_TTL_HOURS:-24}
      BIOGAMED_INVITATION_COOLDOWN_SECONDS: ${BIOGAMED_INVITATION_COOLDOWN_SECONDS:-60}
      BIOGAMED_SMTP_HOST: ${BIOGAMED_SMTP_HOST:-}
      BIOGAMED_SMTP_PORT: ${BIOGAMED_SMTP_PORT:-587}
      BIOGAMED_SMTP_SECURITY: ${BIOGAMED_SMTP_SECURITY:-starttls}
      BIOGAMED_SMTP_FROM: ${BIOGAMED_SMTP_FROM:-}
      BIOGAMED_SMTP_USERNAME: ${BIOGAMED_SMTP_USERNAME:-}
      BIOGAMED_SMTP_PASSWORD: ${BIOGAMED_SMTP_PASSWORD:-}
      BIOGAMED_CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-14004}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19004}:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-19004}
    command: npm run start
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-14004}:3000"
    depends_on:
      - backend
volumes:
  data:
